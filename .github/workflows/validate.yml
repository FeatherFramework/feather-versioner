name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: find server shared tests -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p && luac5.4 -p config.lua
      - name: Run offline behavioral suite
        run: lua5.4 tests/run.lua
